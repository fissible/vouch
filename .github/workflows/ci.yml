name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.4']

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache composer deps
        uses: actions/cache@v5
        with:
          path: vendor
          # patches/ is part of the key: vendor/ carries an applied patch, so a
          # changed patch with an unchanged composer.json would otherwise restore
          # a stale, unpatched plugin from cache.
          key: composer-${{ matrix.os }}-${{ matrix.php }}-${{ hashFiles('composer.json', 'patches/**') }}

      - name: Install
        run: composer install --prefer-dist --no-progress

      - name: PHPStan
        run: composer stan

      - name: Pest
        run: composer test

  # ONLY the Kernel passes run per push, and they are the two that actually
  # gate: covered-MSI >= 95 and full MSI >= 80, the committed Phase 1 exit
  # criteria. 26 files, ~5 minutes.
  #
  # The Phase 2 sweep is NOT here. It covers 162 files, takes hours, and
  # carries no --min at all — so it gated nothing while running to GitHub's
  # six-hour job limit on every push. It is measurement, not a gate, and it now
  # runs on a schedule in mutation-sweep.yml.
  # Split into one job per gate, rather than raising a single timeout.
  #
  # `mutate:kernel` ran both gates in sequence, and each one re-runs the WHOLE
  # suite before its mutants. Measured on the run that failed: install ~3m,
  # suite ~3m, msi mutants ~10.5m, suite again ~2.5m, covered mutants ~11m —
  # about 30 minutes of genuinely sequential work against a 25-minute cap. The
  # score itself was fine (87.29% full MSI, floor 80), so this was wall-clock,
  # not quality.
  #
  # The two gates are independent, so they parallelize. That keeps each timeout
  # tight enough to still mean something.
  #
  # 2026-09-02: both gates now run against tests/Kernel rather than the whole
  # suite, which took `msi` from 15m55s to 33s locally -- roughly 22x, with an
  # IDENTICAL result: 5 untested, 25 uncovered, 206 tested, 87.29%.
  #
  # The cost was never the mutant count. It is 236 either way. `--class=Kernel`
  # scoped the mutated SOURCE and nothing scoped the covering TESTS, so Pest
  # drew them from all 2,014 tests -- and Kernel classes like AssuranceFacts and
  # FactorStrength are touched by nearly every session, token and route test,
  # each of which boots Testbench and migrates. A mutant a sub-millisecond unit
  # test could kill was instead re-running a slice of the slowest integration
  # tests, 236 times over.
  #
  # Scoping is also the more honest gate. The Kernel is framework-free by
  # design, so its mutants should die to framework-free tests; one previously
  # survived tests/Kernel and was being held up by an HTTP test
  # (ErrorShaper's null-safe retry guard, now covered directly). Anything else
  # that starts depending on an integration test to stay green is a Kernel
  # coverage gap, and this gate should say so rather than hide it.
  #
  # Install is cached, as the `test` job does. --parallel was considered and is
  # unnecessary: it would have bought 2-3x on a 4-core runner against a problem
  # that scoping removed entirely.
  mutation:
    runs-on: ubuntu-latest
    # Back down from the 30 this needed while the gate was re-running the whole
    # suite per mutant. A cap only guards anything while it is close to the real
    # cost.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        gate: [msi, covered]

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring
          coverage: pcov

      - name: Cache composer deps
        uses: actions/cache@v5
        with:
          path: vendor
          # Same key shape as the test job, including patches/: vendor carries
          # an applied patch, so a changed patch with an unchanged composer.json
          # would otherwise restore a stale, unpatched plugin.
          key: composer-mutation-8.4-${{ hashFiles('composer.json', 'patches/**') }}

      - name: Install
        run: composer install --prefer-dist --no-progress

      - name: Kernel mutation gate
        run: composer mutate:${{ matrix.gate }}

  # The adversarial attempt-store matrix. SQLite is a supported target and must
  # be verified, but cannot prove MySQL or Postgres locking, transaction, and
  # concurrent-CAS behaviour — the differences between the engines are exactly
  # what this job exists to surface.
  database-matrix:
    runs-on: ubuntu-latest
    # A contention test that is not bounded HANGS rather than failing, and PHP
    # cannot interrupt itself out of a blocked driver call. Without this the
    # job runs to the platform limit and has to be cancelled by hand, which is
    # what happened on the first run this repository ever did.
    #
    # 35, not 25: 2.4 roughly doubled the Tokens suite, and MySQL was cancelled
    # at 25 while still making steady progress — every test passing, none
    # hanging. The MySQL service is tuned below to address the actual cost; this
    # keeps headroom without turning the hang guard into a rubber stamp.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: vouch_test
        ports: ['3306:3306']
        # NOTE: service `options` are docker create arguments, not mysqld
        # arguments, and GitHub does not allow overriding a service's command —
        # so server tuning cannot live here. It is applied at runtime by the
        # "Tune MySQL for a disposable database" step below.
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vouch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, pcntl, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install
        run: composer install --prefer-dist --no-progress

      # VOUCH_SQLITE_PATH is a FILE, never :memory:. Each connection to an
      # in-memory SQLite database gets its own private database, so the
      # contention tests would pass without anything having raced.
      # Durability off, at runtime because service options cannot carry mysqld
      # flags. This database exists for one job and is discarded, so
      # fsync-per-commit buys nothing and costs a great deal: DatabaseMigrations
      # migrates and rolls back the whole set around every test, and MySQL has
      # no transactional DDL, so each test is thousands of real statements.
      # sync_binlog is settable at runtime; log_bin is not, which is why this is
      # a mitigation rather than the full local-container speedup.
      - name: Tune MySQL for a disposable database
        if: matrix.db == 'mysql'
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "
            SET GLOBAL innodb_flush_log_at_trx_commit = 0;
            SET GLOBAL sync_binlog = 0;
          "

      - name: Database suite
        env:
          VOUCH_TEST_DB: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: vouch_test
          DB_PASSWORD: password
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
          VOUCH_SQLITE_PATH: ${{ runner.temp }}/vouch-matrix.sqlite
        # The matrix is a completion gate for persistence-sensitive package
        # behaviour, not only the original contention suite. Run the whole
        # suite so grace expiry, flow/session rotation and HTTP bindings are
        # exercised against every supported engine as well.
        run: vendor/bin/pest

  # Single stable required status check for branch protection. Requiring the
  # matrix jobs directly means their names embed the matrix values, so editing
  # the matrix silently drops required checks without failing anything.
  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: [test, mutation, database-matrix]
    if: always()
    steps:
      - name: Require every upstream job to have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more CI jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - run: echo "All CI jobs succeeded."
