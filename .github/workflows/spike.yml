name: Spike

on:
  push:
    branches: ['spike/**']

jobs:
  engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: password, MYSQL_DATABASE: vouch_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: password, POSTGRES_DB: vouch_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, pcntl, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
      - run: composer install --prefer-dist --no-progress

      # The contention file ALONE, so a hang or failure is unambiguous and
      # cannot be blamed on suite state. Bounded so pgsql cannot hang the run.
      - name: contention only (${{ matrix.db }})
        continue-on-error: true
        timeout-minutes: 6
        env:
          VOUCH_TEST_DB: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: vouch_test
          DB_PASSWORD: password
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
        run: vendor/bin/pest tests/Concurrency/ 2>&1 | tail -60

      # Then the whole suite on this engine, bounded the same way.
      - name: full suite (${{ matrix.db }})
        continue-on-error: true
        timeout-minutes: 15
        env:
          VOUCH_TEST_DB: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: vouch_test
          DB_PASSWORD: password
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
        run: vendor/bin/pest 2>&1 | tail -40

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'json, mbstring', coverage: pcov }
      - run: composer install --prefer-dist --no-progress
      - name: mutate (tail only)
        continue-on-error: true
        timeout-minutes: 25
        run: composer mutate 2>&1 | tail -40
